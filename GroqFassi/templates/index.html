<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq & FAISS Vector Search</title>
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for better readability and centering */
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #10B981;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin-left: 8px;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 flex flex-col items-center p-8">

    <div class="max-w-4xl w-full">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-8 text-center tracking-tight">
            Vector Search & AI RAG Demo
        </h1>

        <!-- Input Form -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <label for="question-input" class="block text-sm font-medium text-gray-700 mb-2">
                Enter your question:
            </label>
            <div class="flex space-x-3">
                <input type="text" id="question-input" class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm" placeholder="e.g., Why do earthquakes occur in Delhi?" required>
                <button id="submit-button" class="flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition duration-150 ease-in-out">
                    Submit
                    <div id="loading-spinner" class="loading-spinner"></div>
                </button>
            </div>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="hidden">
            <div class="grid md:grid-cols-2 gap-6">
                <!-- Left Panel: Question and Answer -->
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">RAG Response</h2>
                    <div class="mb-4">
                        <h3 class="font-semibold text-gray-700 mb-1">Question:</h3>
                        <p id="display-question" class="text-gray-900 italic"></p>
                    </div>

                    <div class="mb-4">
                        <h3 class="font-semibold text-gray-700 mb-1">Groq Answer:</h3>
                        <textarea id="answer-output" readonly rows="10" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 focus:outline-none"></textarea>
                    </div>
                </div>

                <!-- Right Panel: Visualization -->
                <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-200 flex flex-col items-center">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">3D Visualization</h2>
                    <img id="graph-image" src="" alt="3D Visualization of Embeddings" class="w-full h-auto rounded-lg border border-gray-300">
                    <p class="text-sm text-gray-500 mt-2">
                        Red Diamond (Q) = Question, Green Line = Best Match, Blue Dot (O) = Document Option.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('question-input');
        const button = document.getElementById('submit-button');
        const spinner = document.getElementById('loading-spinner');
        const resultsContainer = document.getElementById('results-container');
        const displayQuestion = document.getElementById('display-question');
        const answerOutput = document.getElementById('answer-output');
        const graphImage = document.getElementById('graph-image');

        // Function to handle the API call
        async function fetchAnswer() {
            const question = input.value.trim();
            if (!question) return;

            // 1. Show loading state
            button.disabled = true;
            spinner.style.display = 'inline-block';
            answerOutput.value = 'Searching for best match and generating AI response...';
            resultsContainer.classList.remove('hidden');

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question: question })
                });

                const data = await response.json();

                if (response.ok) {
                    // 2. Update UI with successful data
                    displayQuestion.textContent = data.question;
                    answerOutput.value = data.answer;
                    graphImage.src = data.graph_url + '?' + new Date().getTime(); // Append timestamp to bust cache
                    resultsContainer.classList.remove('hidden');
                } else {
                    // 3. Handle API error responses
                    answerOutput.value = `Error: ${data.error || 'Server failed to process request.'}`;
                    graphImage.src = '';
                }

            } catch (error) {
                // 4. Handle network or parsing errors
                console.error('Fetch Error:', error);
                answerOutput.value = 'A network error occurred. Please check your console.';
            } finally {
                // 5. Hide loading state
                button.disabled = false;
                spinner.style.display = 'none';
            }
        }

        // Event listener for the button click
        button.addEventListener('click', fetchAnswer);
        
        // Allow pressing Enter key in the input field
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault(); // Prevent default form submission
                fetchAnswer();
            }
        });

    </script>
</body>
</html>
